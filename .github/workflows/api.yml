name: API checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: churchfinder
          POSTGRES_PASSWORD: churchfinder
          POSTGRES_DB: churchfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U churchfinder -d churchfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install uv==0.7.15
          uv sync --locked
      - name: Check code
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test SQLite
        run: uv run pytest -q
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          node --check frontend/public/churchfinder.js
      - name: Test PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://churchfinder:churchfinder@localhost:5432/churchfinder_test
        run: uv run pytest -q
